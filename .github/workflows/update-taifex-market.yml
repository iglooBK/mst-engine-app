name: Update TAIFEX + CME Gold Market Cache

on:
  workflow_dispatch:
  schedule:
    # Taiwan time; multiple post-close attempts handle official publication delay.
    - cron: '20,50 5 * * 1-5'
      timezone: 'Asia/Taipei'
    - cron: '20,50 14 * * 1-5'
      timezone: 'Asia/Taipei'
    - cron: '20 15 * * 1-5'
      timezone: 'Asia/Taipei'

permissions:
  contents: write

concurrency:
  group: taifex-market-cache
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch TAIFEX official market data
        run: python fetch-taifex-market.py
      - name: Fetch CME Gold official settlement data
        id: cme_gold
        continue-on-error: true
        run: python fetch-cme-gold-PRODUCTION.py

      - name: Commit cache only when changed
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- taifex-market-latest.json cme-gold-latest.json)" ]; then
            echo "No TAIFEX / CME Gold data change."
            exit 0
          fi

          git config user.name "PLOUTOS Market Bot"
          git config user.email "actions@users.noreply.github.com"

          [ -f taifex-market-latest.json ] && git add taifex-market-latest.json
          [ -f cme-gold-latest.json ] && git add cme-gold-latest.json

          if git diff --cached --quiet; then
            echo "No cache file staged."
            exit 0
          fi

          git commit -m "chore: update TAIFEX and CME Gold market cache"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Fail if CME Gold fetch failed
        if: steps.cme_gold.outcome == 'failure'
        run: |
          echo "::error::CME Gold official settlement fetch failed."
          exit 1
    

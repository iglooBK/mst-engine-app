name: Update TAIFEX Market Cache

on:
  workflow_dispatch:
  schedule:
    # Day session post-close retries — Taiwan 14:20 / 14:50 / 15:20
    - cron: "20,50 6 * * 1-5"
    - cron: "20 7 * * 1-5"

    # After-hours post-close retries — Taiwan 05:20 / 05:50
    # 05:20/05:50 Taiwan = 21:20/21:50 UTC on the previous calendar day.
    - cron: "20,50 21 * * 0-4"

permissions:
  contents: write

concurrency:
  group: taifex-market-cache
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Fetch TAIFEX official market data
        run: python fetch-taifex-market.py

      - name: Commit cache only when changed
        shell: bash
        run: |
          if git diff --quiet -- taifex-market-latest.json; then
            echo "No TAIFEX market-data change."
            exit 0
          fi

          git config user.name "PLOUTOS Market Bot"
          git config user.email "actions@users.noreply.github.com"

          git add taifex-market-latest.json
          git commit -m "chore: update TAIFEX market cache"

          # The cache is maintained by this workflow on the default branch.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

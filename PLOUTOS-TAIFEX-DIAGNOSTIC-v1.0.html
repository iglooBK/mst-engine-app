<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PLOUTOS TAIFEX Diagnostic v1.0</title>
<style>
body{margin:0;background:#08101b;color:#d7e3f4;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
main{max-width:980px;margin:auto;padding:24px}
h1{color:#ffb11b;font-size:22px}.box{border:1px solid #26374e;border-radius:12px;padding:16px;margin:14px 0;background:#0d1624}
button{background:#20324e;color:white;border:1px solid #3b557a;border-radius:8px;padding:12px 18px;font-weight:700}
.ok{color:#36d676}.bad{color:#ff5252}.warn{color:#ffbd45}.muted{color:#8294ad}
pre{white-space:pre-wrap;word-break:break-word;background:#070c13;border-radius:8px;padding:12px;max-height:420px;overflow:auto}
</style>
</head>
<body><main>
<h1>🧪 PLOUTOS // TAIFEX OFFICIAL DIAGNOSTIC v1.0</h1>
<div class="box">
<p>用途：確認 GitHub Pages / 手機瀏覽器能否直接存取 TAIFEX OpenAPI，以及實際 JSON 欄位與 TX 近月資料。</p>
<button id="run">▶ 開始測試</button>
<p id="summary" class="muted">尚未測試</p>
</div>
<div class="box"><b>STEP 1 // DIRECT FETCH</b><pre id="direct">等待...</pre></div>
<div class="box"><b>STEP 2 // RESPONSE / SCHEMA</b><pre id="schema">等待...</pre></div>
<div class="box"><b>STEP 3 // TX ROWS</b><pre id="tx">等待...</pre></div>
<div class="box"><b>STEP 4 // RESULT</b><pre id="result">等待...</pre></div>
<script>
const URL='https://openapi.taifex.com.tw/v1/DailyMarketReportFut';
const $=id=>document.getElementById(id);
const out=(id,x)=>$(id).textContent=typeof x==='string'?x:JSON.stringify(x,null,2);
function val(o,keys){for(const k of keys)if(o&&Object.prototype.hasOwnProperty.call(o,k))return o[k]}
function num(v){const n=Number(String(v??'').replace(/,/g,'').trim());return Number.isFinite(n)?n:null}
async function run(){
 $('summary').className='warn'; $('summary').textContent='測試中...';
 out('direct','連線中...'); out('schema','等待...'); out('tx','等待...'); out('result','等待...');
 let r,j;
 try{
   const ctl=new AbortController(); const timer=setTimeout(()=>ctl.abort(),12000);
   r=await fetch(URL,{cache:'no-store',signal:ctl.signal});
   clearTimeout(timer);
   out('direct',`SUCCESS\nHTTP ${r.status} ${r.statusText}\nContent-Type: ${r.headers.get('content-type')||'(none)'}\nURL: ${URL}`);
   if(!r.ok) throw new Error(`HTTP ${r.status}`);
   j=await r.json();
 }catch(e){
   out('direct',`FAILED\n${e?.name||'Error'}: ${e?.message||e}\n\n若瀏覽器 Console 顯示 CORS / Access-Control-Allow-Origin，代表 TAIFEX 官方 API 不允許 GitHub Pages 直接跨網域讀取。`);
   out('result','❌ DIRECT TAIFEX OFFICIAL 無法由此瀏覽器環境取得。\n請把這個畫面截圖給 ChatGPT。');
   $('summary').className='bad'; $('summary').textContent='❌ Direct Fetch 失敗';
   return;
 }
 const rows=Array.isArray(j)?j:(Array.isArray(j?.data)?j.data:[]);
 out('schema',{topLevel:Array.isArray(j)?'ARRAY':typeof j,rowCount:rows.length,firstRowKeys:rows[0]?Object.keys(rows[0]):[],firstRow:rows[0]||null});
 const tx=rows.filter(o=>String(val(o,['契約','Contract','商品契約代號','商品代號'])??'').trim().toUpperCase()==='TX');
 const outright=tx.filter(o=>/^\d{6}$/.test(String(val(o,['到期月份(週別)','到期月份','Contract Month(Week)','ContractMonth'])??'').trim()));
 const sample=outright.slice(0,12).map(o=>({
   日期:val(o,['日期','交易日期','Date']),
   契約:val(o,['契約','Contract']),
   到期月份:val(o,['到期月份(週別)','到期月份','Contract Month(Week)','ContractMonth']),
   最後成交價:val(o,['最後成交價','收盤價','Last','Closing Price','ClosingPrice','Close']),
   漲跌價:val(o,['漲跌價','Change']),
   漲跌百分比:val(o,['漲跌%','漲跌％','漲跌百分比','Change Percent','ChangePercent']),
   交易時段:val(o,['交易時段','Trading Session','TradingSession','Session'])
 }));
 out('tx',{TX總筆數:tx.length,TX純月份契約筆數:outright.length,sample});
 if(outright.length){
   out('result','✅ TAIFEX API 可直接存取，而且已找到 TX 月份契約。\n這代表問題在 PLOUTOS parser / 選月或交易時段邏輯，不是 CORS。\n\n請把 STEP 2、STEP 3 截圖給 ChatGPT。');
   $('summary').className='ok'; $('summary').textContent='✅ API 成功，找到 TX 資料';
 }else{
   out('result','⚠️ API 可存取，但目前的欄位辨識沒有找到 TX 純月份契約。\n請把 STEP 2 的 firstRowKeys / firstRow 截圖給 ChatGPT。');
   $('summary').className='warn'; $('summary').textContent='⚠️ API 成功，但 TX schema 尚未匹配';
 }
}
$('run').onclick=run;
run();
</script>
</main></body></html>
